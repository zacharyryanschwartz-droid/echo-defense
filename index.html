<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Echo Defense — Tower prototype v0.9 (Schwarze Spiele)</title>
<style>
  html,body{margin:0;padding:0;background:#0b0d12;color:#dde3ee;font:14px/1.3 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #wrap{max-width:560px;margin:0 auto;padding:6px 6px calc(10px + env(safe-area-inset-bottom));}
  #top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
  #top b{font-size:16px}
  #hud{font-weight:600}
  #readout{margin:4px 0;padding:4px 8px;border-radius:6px;background:#2a1d10;color:#ffd166;font-weight:600}
  #how{font-size:12px;color:#9aa6b8;margin:2px 0 4px}
  canvas{display:block;touch-action:none;background:#151a22;margin:0 auto;border-radius:8px;max-width:100%}
  #msg{min-height:18px;margin:4px 0;font-size:13px;color:#cfe3ff}
  #tools{display:flex;flex-wrap:wrap;gap:5px}
  button{font:inherit;font-size:13px;min-height:40px;padding:6px 10px;border-radius:8px;border:1px solid #3a4558;background:#1f2633;color:#e6ecf5}
  button.on{background:#3b5bdb;border-color:#748ffc}
  button.go{background:#2b8a3e;border-color:#51cf66;font-weight:700}
  button:disabled{opacity:.4}
  #restart{background:#5c1f1f;border-color:#a33}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><b>Echo Defense</b><span id="hud"></span><button id="restart">Restart</button></div>
  <div id="how">How to play: build walls (tap a side) and turrets (tap a ring dot) once, then survive 5 hordes. Creatures that break a defense get a <span style="color:#ffd166">yellow ring</span> and tell their neighbours; between rounds patch, move turrets onto known gaps to make rumors stale, and move armies.</div>
  <div id="readout"></div>
  <canvas id="c"></canvas>
  <div id="msg"></div>
  <div id="tools"></div>
</div>
<script>
"use strict";
// ================= CONFIG =================
const params = new URLSearchParams(location.search);
const FAST = params.has('fast') ? (parseFloat(params.get('fast')) > 0 ? parseFloat(params.get('fast')) : 3) : 1; // ?fast=N -> N x speed
let seed = params.has('seed') ? (parseInt(params.get('seed')) || 1) : (Math.random() * 1e9) | 0;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

const WORLD = 560, C = WORLD / 2;
const SIDES = 8, SA = Math.PI * 2 / SIDES;
const SIDE_NAMES = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const TOWER_R = 24, WALL_R = 90, SLOT_R = 128, ARMY_R = 165, SPAWN_R = 270, ORBIT_R = 175, INNER_R = 60;
const TILE = 20, RUMOR_R = 2 * TILE;          // creatures within ~2 tiles learn
const ROUNDS = 5;
const HORDE = [40, 50, 60, 70, 80];
const SHARE = [0, 0.10, 0.25, 0.45, 0.70];
const SPAWN_TIME = 20;                          // seconds over which a horde spawns
const BUDGET = 200, TOWER_MAX = 100;
const WALL_LV = [{ cost: 0, hp: 0 }, { cost: 10, hp: 40 }, { cost: 20, hp: 80 }, { cost: 30, hp: 120 }];
const TT = { // turret types: damage multipliers vs enemy types
  basic: { name: 'Basic', cost: 15, col: '#e9ecef', vs: { ground: 1, flyer: 0, armored: 0.25 } },
  aa:    { name: 'Anti-air', cost: 20, col: '#4dabf7', vs: { ground: 0.5, flyer: 1.5, armored: 0 } },
  ap:    { name: 'Armor-piercing', cost: 25, col: '#ff922b', vs: { ground: 0.6, flyer: 0, armored: 1.5 } },
};
const TT_ORDER = ['basic', 'aa', 'ap'];
const ET = { // enemy types
  ground:  { hp: 3,  spd: 20, wallDps: 3, towerDmg: 2, col: '#69db7c', walls: true },
  flyer:   { hp: 2.5, spd: 26, wallDps: 0, towerDmg: 2, col: '#66d9e8', walls: false },
  armored: { hp: 8, spd: 13, wallDps: 5, towerDmg: 4, col: '#ffa94d', walls: true },
};
const COUNTER = { ground: ['basic', 'aa', 'ap'], flyer: ['aa'], armored: ['ap'] };
const ARMY_RANGE = 30, ARMY_DPS = 2.5, ARMY_TRAVEL = 8;

// ================= STATE =================
let S;
function newGame() {
  S = {
    phase: 'build', round: 0, budget: BUDGET, tower: TOWER_MAX,
    walls: Array.from({ length: SIDES }, () => ({ lv: 0, hp: 0, max: 0 })),
    slots: Array.from({ length: SIDES }, () => null),   // turret {type, lv, cd}
    armies: [{ side: 0, delay: 0 }, { side: 4, delay: 0 }],
    enemies: [], queue: [], spawnT: 0, spawnEvery: 0.5,
    rumors: {},            // side -> {side, byType, kind, stale}
    carried: [],           // survivors: [{type, know:[sides]}]
    fx: [], shots: [],
    mode: null, sel: null, patches: 0, moves: 0, log: [],
    stats: { killed: 0, escaped: 0, breaches: 0, staleHits: 0 },
    time: 0, towerCd: 0,
  };
  S.msg = 'BUILD: tap a wall side to cycle its strength, tap a ring dot to cycle turret type. Tap an army (purple) then a side to move it.';
  ui();
}

// ================= HELPERS =================
const sideAng = s => s * SA;
const sideOf = a => ((Math.round(a / SA) % SIDES) + SIDES) % SIDES;
const norm = a => { a %= Math.PI * 2; if (a > Math.PI) a -= Math.PI * 2; if (a < -Math.PI) a += Math.PI * 2; return a; };
const P = (r, a) => ({ x: C + r * Math.sin(a), y: C - r * Math.cos(a) });
const epos = e => P(e.r, e.a);
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
const trueGaps = () => Object.values(S.rumors).filter(r => !r.stale).length;
const staleGaps = () => Object.values(S.rumors).filter(r => r.stale).length;
function pickType(round) {
  const x = rnd(), fly = round === 0 ? 0.15 : 0.22, arm = round === 0 ? 0.12 : 0.22;
  return x < fly ? 'flyer' : x < fly + arm ? 'armored' : 'ground';
}

// ================= RUMORS =================
function breach(e, s, kind) {
  const r = S.rumors[s];
  if (r && r.stale) S.stats.staleHits++;
  if (!r || r.stale || r.byType !== e.type) S.rumors[s] = { side: s, byType: e.type, kind, stale: false };
  S.stats.breaches++;
  spread(e, s, 0);
}
function spread(src, s, hop) {
  src.know.add(s);
  const p = epos(src);
  S.fx.push({ x: p.x, y: p.y, t: 0 });
  if (hop >= 2) return;
  for (const o of S.enemies) {
    if (o.dead || o.know.has(s)) continue;
    if (dist(p, epos(o)) <= RUMOR_R) { o.know.add(s); if (o.r > WALL_R + 12) o.committed = false; spread(o, s, hop + 1); }
  }
}
function makeStale(s, why) {
  const r = S.rumors[s];
  if (r && !r.stale) { r.stale = true; S.log.push(`${SIDE_NAMES[s]} rumor is now STALE (${why})`); return true; }
  return false;
}
function counters(turret, type) { return turret && COUNTER[type].includes(turret.type); }

// ================= ROUNDS =================
function startRound() {
  const n = HORDE[S.round];
  // stale rumors lose about half their believers each round
  for (const c of S.carried) c.know = c.know.filter(s => S.rumors[s] && (!S.rumors[s].stale || rnd() < 0.5));
  // rumors live only in creatures who know them
  const alive = pruneRumors();
  const list = [];
  const carried = S.carried.slice(0, n);
  carried.forEach(c => list.push({ type: c.type, know: c.know.slice(), vet: true }));
  const knowers = carried.filter(c => c.know.length);
  const target = alive.size ? Math.round(SHARE[S.round] * n) : 0;
  let need = Math.max(0, target - knowers.length);
  while (list.length < n) {
    const k = need > 0 && knowers.length ? knowers[(rnd() * knowers.length) | 0].know.slice() : [];
    if (k.length) need--;
    list.push({ type: pickType(S.round), know: k, vet: false });
  }
  for (let i = list.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [list[i], list[j]] = [list[j], list[i]]; }
  S.queue = list; S.spawnEvery = SPAWN_TIME / n; S.spawnT = 0;
  S.carried = []; S.enemies = []; S.phase = 'round'; S.mode = null; S.sel = null;
  S.startKnowers = list.filter(x => x.know.length).length;
  S.msg = `Round ${S.round + 1}: ${n} creatures, ${S.startKnowers} already know a weak spot.`;
  ui();
}
function spawn(d) {
  const t = ET[d.type];
  S.enemies.push({ type: d.type, hp: t.hp * (1 + 0.08 * S.round), max: t.hp * (1 + 0.08 * S.round), r: SPAWN_R, a: rnd() * Math.PI * 2,
    know: new Set(d.know), target: -1, committed: d.know.length === 0, vet: d.vet, dead: false });
}
function pruneRumors() { // rumors live only in creatures who know them: kill the messenger and the rumor dies
  const alive = new Set(); S.carried.forEach(c => c.know.forEach(s => alive.add(s)));
  for (const k of Object.keys(S.rumors)) if (!alive.has(+k)) delete S.rumors[k];
  return alive;
}
function endRound() {
  S.round++;
  pruneRumors();
  if (S.round >= ROUNDS) { S.phase = 'won'; S.msg = `YOU WIN! The tower held all 5 rounds with ${Math.ceil(S.tower)} HP left.`; ui(); return; }
  S.phase = 'between'; S.patches = 3; S.moves = 2; S.mode = null; S.sel = null; S.log = [];
  S.msg = `Round ${S.round} survived. ${S.carried.length} creatures escaped and carry what they learned. Use 3 patches and 2 turret moves.`;
  ui();
}

// ================= UPDATE =================
function update(dt) {
  S.time += dt;
  for (const f of S.fx) f.t += dt; S.fx = S.fx.filter(f => f.t < 0.6);
  for (const s of S.shots) s.t += dt; S.shots = S.shots.filter(s => s.t < 0.12);
  if (S.phase !== 'round') return;
  S.spawnT -= dt;
  while (S.queue.length && S.spawnT <= 0) { spawn(S.queue.shift()); S.spawnT += S.spawnEvery; }
  for (const a of S.armies) if (a.delay > 0) a.delay -= dt;

  for (const e of S.enemies) {
    if (e.dead) continue;
    const t = ET[e.type], v = t.spd * dt;
    if (!e.committed && e.target < 0 && e.know.size) {
      let best = -1, bd = 9;
      for (const s of e.know) { const d = Math.abs(norm(sideAng(s) - e.a)); if (d < bd) { bd = d; best = s; } }
      e.target = best;
    }
    if (!e.committed && e.target >= 0) {
      const d = norm(sideAng(e.target) - e.a);
      if (Math.abs(d) < 0.03) { e.committed = true; e.a = sideAng(e.target) + (rnd() - 0.5) * 0.5; }
      else if (e.r > ORBIT_R) e.r = Math.max(ORBIT_R, e.r - v);
      else e.a += Math.sign(d) * Math.min(Math.abs(d), v / e.r);
      continue;
    }
    let nr = e.r - v;
    const s = sideOf(e.a), w = S.walls[s];
    if (t.walls && w.hp > 0 && e.r >= WALL_R + 4 && nr < WALL_R + 4) {
      nr = WALL_R + 4; w.hp -= t.wallDps * dt;
      if (w.hp <= 0) { w.hp = 0; breach(e, s, 'wall'); }
    }
    if (e.r >= INNER_R && nr < INNER_R) breach(e, s, 'slip');
    e.r = nr;
    if (e.r <= TOWER_R) { S.tower -= t.towerDmg; e.dead = true; S.stats.escaped++; S.carried.push({ type: e.type, know: [...e.know] }); }
  }
  // turrets
  S.slots.forEach((tu, i) => {
    if (!tu) return;
    tu.cd -= dt; if (tu.cd > 0) return;
    const sp = P(SLOT_R, sideAng(i)), range = 95 + 12 * (tu.lv - 1);
    let best = null, bs = -1e9;
    for (const e of S.enemies) {
      if (e.dead || TT[tu.type].vs[e.type] === 0) continue;
      const d = dist(sp, epos(e)); if (d > range) continue;
      const score = (e.know.size ? 1000 : 0) - e.r; // kill the messenger first
      if (score > bs) { bs = score; best = e; }
    }
    if (!best) return;
    tu.cd = 0.7;
    best.hp -= 2 * (1 + 0.5 * (tu.lv - 1)) * TT[tu.type].vs[best.type];
    const ep = epos(best); S.shots.push({ x1: sp.x, y1: sp.y, x2: ep.x, y2: ep.y, col: TT[tu.type].col, t: 0 });
  });
  // armies: area damage to ground units
  for (const a of S.armies) {
    if (a.delay > 0) continue;
    const ap = P(ARMY_R, sideAng(a.side));
    for (const e of S.enemies) if (!e.dead && e.type !== 'flyer' && dist(ap, epos(e)) <= ARMY_RANGE) e.hp -= ARMY_DPS * dt * (e.type === 'armored' ? 0.5 : 1);
  }
  // the tower itself has a weak gun that hits anything close
  S.towerCd -= dt;
  if (S.towerCd <= 0) {
    let best = null; for (const e of S.enemies) if (!e.dead && e.r < 75 && (!best || e.r < best.r)) best = e;
    if (best) { S.towerCd = 0.5; best.hp -= 1; const ep = epos(best); S.shots.push({ x1: C, y1: C, x2: ep.x, y2: ep.y, col: '#ffffff', t: 0 }); }
  }
  for (const e of S.enemies) if (!e.dead && e.hp <= 0) { e.dead = true; S.stats.killed++; }
  S.enemies = S.enemies.filter(e => !e.dead);
  if (S.tower <= 0) { S.tower = 0; S.phase = 'lost'; S.msg = `The tower fell in round ${S.round + 1}. The horde knew ${trueGaps()} side gaps. Tap Restart to try a new build.`; ui(); return; }
  if (!S.queue.length && !S.enemies.length) endRound();
}

// ================= INPUT =================
function hit(x, y) {
  const dx = x - C, dy = y - C, r = Math.hypot(dx, dy), a = Math.atan2(dx, -dy);
  for (let i = 0; i < SIDES; i++) if (dist({ x, y }, P(SLOT_R, sideAng(i))) < 20) return { kind: 'slot', i };
  for (let i = 0; i < S.armies.length; i++) if (dist({ x, y }, P(ARMY_R, sideAng(S.armies[i].side))) < 20) return { kind: 'army', i };
  if (r < TOWER_R + 8) return { kind: 'tower' };
  if (r > WALL_R - 20 && r < WALL_R + 22) return { kind: 'wall', i: sideOf(a) };
  if (r > ARMY_R - 35) return { kind: 'side', i: sideOf(a) };
  return null;
}
function tap(x, y) {
  const h = hit(x, y); if (!h) return;
  const ph = S.phase;
  if (ph !== 'build' && ph !== 'between') return;
  // armies: select then tap a side
  if (S.sel && S.sel.kind === 'army' && (h.kind === 'side' || h.kind === 'slot' || h.kind === 'wall')) {
    const a = S.armies[S.sel.i], s = h.i;
    if (S.armies.some(o => o !== a && o.side === s)) { S.msg = 'Another army is already there.'; ui(); return; }
    if (a.side !== s) {
      a.side = s;
      if (ph === 'between') { a.delay = ARMY_TRAVEL; if (makeStale(s, 'army moved in')) S.msg = `Army moved to ${SIDE_NAMES[s]}: that rumor is stale. It arrives ${ARMY_TRAVEL}s into the next round.`; else S.msg = `Army will arrive at ${SIDE_NAMES[s]} ${ARMY_TRAVEL}s into the next round.`; }
    }
    S.sel = null; ui(); return;
  }
  if (h.kind === 'army') { S.sel = { kind: 'army', i: h.i }; S.msg = 'Army selected: tap a side (outer ring) to move it there.'; ui(); return; }
  if (ph === 'build') return buildTap(h);
  return betweenTap(h);
}
function buildTap(h) {
  if (h.kind === 'wall') {
    const w = S.walls[h.i], next = (w.lv + 1) % 4, delta = WALL_LV[next].cost - WALL_LV[w.lv].cost;
    if (delta > S.budget) { const back = WALL_LV[w.lv].cost; S.budget += back; w.lv = 0; w.hp = w.max = 0; S.msg = 'Not enough budget: wall removed (refunded).'; }
    else { S.budget -= delta; w.lv = next; w.hp = w.max = WALL_LV[next].hp; S.msg = `${SIDE_NAMES[h.i]} wall: level ${next} (${w.max} HP).`; }
  } else if (h.kind === 'slot') {
    const cur = S.slots[h.i], idx = cur ? TT_ORDER.indexOf(cur.type) : -1;
    if (cur) S.budget += TT[cur.type].cost;
    S.slots[h.i] = null;
    let nidx = idx + 1;
    while (nidx < TT_ORDER.length && TT[TT_ORDER[nidx]].cost > S.budget) nidx++;
    if (nidx < TT_ORDER.length) { const ty = TT_ORDER[nidx]; S.budget -= TT[ty].cost; S.slots[h.i] = { type: ty, lv: 1, cd: 0 }; S.msg = `${SIDE_NAMES[h.i]} turret: ${TT[ty].name}.`; }
    else S.msg = `${SIDE_NAMES[h.i]} turret slot emptied.`;
  }
  ui();
}
function betweenTap(h) {
  const m = S.mode;
  if (!m) { S.msg = 'Pick an action below first (patch or move), then tap the target.'; ui(); return; }
  if (m === 'moveT') {
    if (!S.sel && h.kind === 'slot' && S.slots[h.i]) { S.sel = { kind: 'slot', i: h.i }; S.msg = 'Now tap an empty ring dot to move it there.'; ui(); return; }
    if (S.sel && h.kind === 'slot') {
      if (S.slots[h.i]) { S.msg = 'That spot is taken: pick an empty dot.'; ui(); return; }
      if (S.moves <= 0) return;
      S.slots[h.i] = S.slots[S.sel.i]; S.slots[S.sel.i] = null; S.moves--;
      S.msg = `Turret moved ${SIDE_NAMES[S.sel.i]} -> ${SIDE_NAMES[h.i]}.` + (makeStale(h.i, 'turret moved in') ? ' That gap rumor is now STALE: believers will walk into it.' : '') + ` ${SIDE_NAMES[S.sel.i]} is now open.`;
      S.sel = null; if (!S.moves) S.mode = null; ui(); return;
    }
    return;
  }
  if (S.patches <= 0) return;
  const r = S.rumors[h.i];
  if ((m === 'repair' || m === 'reinforce') && h.kind === 'wall') {
    const w = S.walls[h.i];
    if (m === 'repair') { if (!w.max) { S.msg = 'No wall was built there (walls are fixed at build).'; ui(); return; } w.hp = w.max; }
    else { if (!w.max) { S.msg = 'No wall was built there (walls are fixed at build).'; ui(); return; } w.max += 30; w.hp = w.max; }
    S.patches--; S.msg = `${SIDE_NAMES[h.i]} wall ${m === 'repair' ? 'repaired' : 'reinforced'} (${w.hp} HP).`;
    if (r && r.kind === 'wall' && r.byType !== 'flyer' && makeStale(h.i, 'wall patched')) S.msg += ' Rumor STALE.';
  } else if ((m === 'upgrade' || m === 'switch') && h.kind === 'slot' && S.slots[h.i]) {
    const tu = S.slots[h.i];
    if (m === 'upgrade') tu.lv++; else tu.type = TT_ORDER[(TT_ORDER.indexOf(tu.type) + 1) % 3];
    S.patches--; S.msg = `${SIDE_NAMES[h.i]} turret: ${TT[tu.type].name} L${tu.lv}.`;
    if (r && counters(tu, r.byType) && makeStale(h.i, 'turret now counters ' + r.byType)) S.msg += ' Rumor STALE.';
  } else { S.msg = 'That target does not fit the chosen action.'; ui(); return; }
  if (!S.patches) S.mode = null;
  ui();
}
function repairTower() {
  if (S.phase !== 'between' || S.patches <= 0 || S.tower >= TOWER_MAX) return;
  S.tower = Math.min(TOWER_MAX, S.tower + 30); S.patches--; S.msg = `Tower repaired to ${Math.ceil(S.tower)} HP.`; if (!S.patches && S.mode !== 'moveT') S.mode = null; ui();
}

// ================= UI =================
const $ = id => document.getElementById(id);
function btn(label, fn, cls, dis) { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; if (cls) b.className = cls; if (dis) b.disabled = true; return b; }
function ui() {
  const ph = S.phase;
  const roundTxt = ph === 'build' ? 'Build' : ph === 'between' ? `After R${S.round}/5` : ph === 'round' ? `Round ${S.round + 1}/5` : ph === 'won' ? 'Won' : 'Lost';
  $('hud').textContent = `${roundTxt} · Tower ${Math.ceil(S.tower)}/${TOWER_MAX}` + (ph === 'build' ? ` · Budget ${S.budget}` : ph === 'between' ? ` · Patches ${S.patches} · Moves ${S.moves}` : '');
  $('msg').textContent = S.msg + (S.log.length && ph === 'between' ? '' : '');
  const T = $('tools'); T.innerHTML = '';
  if (ph === 'build') {
    T.append(btn(`Start round 1 ▶`, () => startRound(), 'go'));
    T.append(btn('Quick build', () => { autoBuild(); }));
  } else if (ph === 'between') {
    const mk = (k, label) => T.append(btn(label, () => { S.mode = S.mode === k ? null : k; S.sel = null; S.msg = { repair: 'Tap a wall to repair it to full.', reinforce: 'Tap a wall to add +30 max HP.', upgrade: 'Tap a turret to upgrade it.', switch: 'Tap a turret to switch its counter type.', moveT: 'Tap a turret, then an empty dot.' }[k] || ''; ui(); }, S.mode === k ? 'on' : '', k === 'moveT' ? S.moves <= 0 : S.patches <= 0));
    mk('repair', 'Repair wall'); mk('reinforce', 'Reinforce wall');
    T.append(btn('Repair tower +30', repairTower, '', S.patches <= 0 || S.tower >= TOWER_MAX));
    mk('upgrade', 'Upgrade turret'); mk('switch', 'Switch type'); mk('moveT', 'Move turret');
    T.append(btn(`Start round ${S.round + 1} ▶`, () => startRound(), 'go'));
  }
  readout();
}
function readout() {
  const marked = S.phase === 'round' ? S.enemies.filter(e => e.know.size).length : S.carried.filter(c => c.know.length).length;
  const gaps = Object.values(S.rumors).map(r => `${SIDE_NAMES[r.side]}${r.stale ? '(stale)' : ''}`).join(' ');
  $('readout').textContent = `Horde knows: ${trueGaps()} side gap${trueGaps() === 1 ? '' : 's'}` + (staleGaps() ? ` (+${staleGaps()} stale)` : '') +
    ` · ${marked} marked ${S.phase === 'round' ? 'on field' : 'survivors'}` + (gaps ? ` · ${gaps}` : '');
}

// ================= RENDER =================
const cv = $('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const w = Math.min(window.innerWidth - 12, 548), hAvail = window.innerHeight - 230;
  const size = Math.max(260, Math.min(w, hAvail > 300 ? hAvail : w));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = size + 'px'; cv.style.height = size + 'px';
  cv.width = size * dpr; cv.height = size * dpr; scale = size / WORLD * dpr;
}
window.addEventListener('resize', resize);
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  tap((ev.clientX - r.left) / r.width * WORLD, (ev.clientY - r.top) / r.height * WORLD);
});

function arc(r, a0, a1, col, lw) { ctx.beginPath(); ctx.arc(C, C, r, a0 - Math.PI / 2, a1 - Math.PI / 2); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); }
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, WORLD, WORLD);
  // side wedges + labels, rumor map
  for (let s = 0; s < SIDES; s++) {
    const a = sideAng(s);
    ctx.strokeStyle = '#222a36'; ctx.lineWidth = 1; ctx.beginPath();
    const p0 = P(TOWER_R + 4, a + SA / 2), p1 = P(SPAWN_R, a + SA / 2); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    const r = S.rumors[s];
    if (r) {
      ctx.beginPath(); ctx.moveTo(C, C); ctx.arc(C, C, 235, a - SA / 2 - Math.PI / 2, a + SA / 2 - Math.PI / 2); ctx.closePath();
      ctx.fillStyle = r.stale ? 'rgba(140,140,160,0.12)' : 'rgba(255,80,60,0.16)'; ctx.fill();
      const lp = P(205, a); ctx.fillStyle = r.stale ? '#8a8fa0' : '#ff6b6b'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(r.stale ? 'STALE' : `GAP: ${r.byType}`, lp.x, lp.y);
    }
    const lp = P(250, a); ctx.fillStyle = '#5c6779'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(SIDE_NAMES[s], lp.x, lp.y);
  }
  // walls
  for (let s = 0; s < SIDES; s++) {
    const w = S.walls[s], a = sideAng(s);
    if (!w.max) { arc(WALL_R, a - SA / 2 + 0.04, a + SA / 2 - 0.04, '#262d39', 3); continue; }
    if (w.hp <= 0) { ctx.setLineDash([4, 6]); arc(WALL_R, a - SA / 2 + 0.04, a + SA / 2 - 0.04, '#e03131', 3); ctx.setLineDash([]); continue; }
    const f = w.hp / w.max;
    arc(WALL_R, a - SA / 2 + 0.04, a + SA / 2 - 0.04, `hsl(${30 + 90 * f},55%,${45 + 10 * f}%)`, 4 + 3 * w.lv);
  }
  // turret slots
  for (let s = 0; s < SIDES; s++) {
    const p = P(SLOT_R, sideAng(s)), tu = S.slots[s];
    const sel = S.sel && S.sel.kind === 'slot' && S.sel.i === s;
    if (!tu) { ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 7); ctx.strokeStyle = '#4a5568'; ctx.lineWidth = 2; ctx.stroke(); continue; }
    if (S.phase !== 'round') { ctx.beginPath(); ctx.arc(p.x, p.y, 95 + 12 * (tu.lv - 1), 0, 7); ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = TT[tu.type].col; ctx.fillRect(p.x - 11, p.y - 11, 22, 22);
    ctx.strokeStyle = sel ? '#ffd43b' : '#000'; ctx.lineWidth = sel ? 3 : 1.5; ctx.strokeRect(p.x - 11, p.y - 11, 22, 22);
    ctx.fillStyle = '#111'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((tu.type === 'basic' ? 'B' : tu.type === 'aa' ? 'AA' : 'AP') + (tu.lv > 1 ? tu.lv : ''), p.x, p.y + 1);
  }
  // armies
  S.armies.forEach((a, i) => {
    const p = P(ARMY_R, sideAng(a.side)), sel = S.sel && S.sel.kind === 'army' && S.sel.i === i;
    ctx.beginPath(); ctx.arc(p.x, p.y, ARMY_RANGE, 0, 7); ctx.fillStyle = 'rgba(177,151,252,0.10)'; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, 7);
    if (a.delay > 0 && S.phase === 'round' || (a.delay > 0 && S.phase === 'between')) { ctx.setLineDash([3, 3]); ctx.strokeStyle = '#b197fc'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.fillStyle = '#9775fa'; ctx.fill(); }
    if (sel) { ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('A', p.x, p.y + 1);
  });
  // tower
  ctx.beginPath(); ctx.arc(C, C, TOWER_R, 0, 7); ctx.fillStyle = '#495057'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(C, C); ctx.arc(C, C, TOWER_R - 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * S.tower / TOWER_MAX); ctx.closePath();
  ctx.fillStyle = S.tower > 50 ? '#40c057' : S.tower > 25 ? '#fab005' : '#fa5252'; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(Math.ceil(S.tower), C, C);
  // shots
  for (const s of S.shots) { ctx.strokeStyle = s.col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); }
  // enemies
  for (const e of S.enemies) {
    const p = epos(e), t = ET[e.type];
    ctx.fillStyle = t.col; ctx.beginPath();
    if (e.type === 'ground') ctx.arc(p.x, p.y, 5, 0, 7);
    else if (e.type === 'flyer') { ctx.moveTo(p.x, p.y - 7); ctx.lineTo(p.x + 6, p.y + 5); ctx.lineTo(p.x - 6, p.y + 5); ctx.closePath(); }
    else ctx.rect(p.x - 6, p.y - 6, 12, 12);
    ctx.fill();
    if (e.know.size) {
      const stale = [...e.know].every(s => S.rumors[s] && S.rumors[s].stale);
      ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, 7); ctx.strokeStyle = stale ? '#adb5bd' : '#ffd43b'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = stale ? '#adb5bd' : '#ffd43b'; ctx.font = 'bold 10px sans-serif'; ctx.fillText('!', p.x, p.y - 15);
    }
  }
  // rumor ripples
  for (const f of S.fx) { ctx.beginPath(); ctx.arc(f.x, f.y, 6 + (RUMOR_R - 6) * f.t / 0.6, 0, 7); ctx.strokeStyle = `rgba(255,212,59,${1 - f.t / 0.6})`; ctx.lineWidth = 2; ctx.stroke(); }
  // legend
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.font = '11px sans-serif';
  ctx.fillStyle = '#69db7c'; ctx.fillText('● ground', 6, 548); ctx.fillStyle = '#66d9e8'; ctx.fillText('▲ flyer (ignores walls)', 70, 548);
  ctx.fillStyle = '#ffa94d'; ctx.fillText('■ armored', 215, 548); ctx.fillStyle = '#ffd43b'; ctx.fillText('◯ knows a gap', 290, 548);
  ctx.fillStyle = '#9aa6b8'; ctx.fillText('B basic · AA anti-air · AP armor-piercing · A army', 6, 16);
  if (S.phase === 'won' || S.phase === 'lost') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, C - 40, WORLD, 80);
    ctx.fillStyle = S.phase === 'won' ? '#69db7c' : '#ff6b6b'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(S.phase === 'won' ? 'TOWER HOLDS — YOU WIN' : 'TOWER FELL', C, C - 8);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('Tap Restart to play again', C, C + 22);
  }
}

// ================= LOOP =================
let last = performance.now(), hudT = 0;
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000) * FAST; last = now;
  while (dt > 0) { const st = Math.min(0.05, dt); update(st); dt -= st; }
  hudT += 1; if (hudT % 10 === 0 && S.phase === 'round') { readout(); $('hud').textContent = `Round ${S.round + 1}/5 · Tower ${Math.ceil(S.tower)}/${TOWER_MAX} · ${S.enemies.length + S.queue.length} left`; }
  draw();
  requestAnimationFrame(frame);
}
function autoBuild() {
  newGame();
  const plan = [[0, 1, 'basic'], [1, 1, 'aa'], [2, 1, 'basic'], [3, 1, null], [4, 1, 'ap'], [5, 1, 'aa'], [6, 1, 'basic'], [7, 1, null]];
  for (const [s, lv, ty] of plan) { S.walls[s] = { lv, hp: WALL_LV[lv].hp, max: WALL_LV[lv].hp }; S.budget -= WALL_LV[lv].cost; if (ty) { S.slots[s] = { type: ty, lv: 1, cd: 0 }; S.budget -= TT[ty].cost; } }
  S.msg = `Quick build placed (${BUDGET - S.budget} spent). Adjust or press Start.`; ui();
}
// test hook (used by headless tests; harmless in play)
window.ED = { get S() { return S; }, newGame, autoBuild, startRound, update, tap, repairTower };
$('restart').onclick = () => { newGame(); };
newGame(); resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
